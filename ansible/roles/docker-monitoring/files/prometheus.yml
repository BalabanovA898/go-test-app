global:
    scrape_interval: 15s
    evaluation_interval: 15s

scrape_configs:
    - job_name: "prometheus"
      static_configs:
          - targets: ["localhost:9090"]
    - job_name: "redis"
      static_configs:
          - targets: ["192.168.122.94:9121"] #HOST_IP
    - job_name: "node-exporter"
      static_configs:
          - targets: ["192.168.122.94:9100"]
